<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 16px -apple-system, sans-serif; padding: 2rem; }
      input[type="number"] { width: 5em; }
      #events { color: #666; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>demo</h1>
    <p>
      <input id="a" type="number" value="2" /> +
      <input id="b" type="number" value="40" />
      <button id="add">add</button>
      <button id="quit">Quit</button>
    </p>
    <pre id="out">booting…</pre>
    <ul id="events"></ul>

    <h2>async commands</h2>
    <p>
      <button id="wait">wait 2s</button>
      <button id="count">count to 20M (sliced)</button>
      <span id="spinner" style="display:inline-block">◐</span>
      <span id="asyncout"></span>
    </p>
    <p style="color:#666;font-size:13px">
      The spinner is driven by the page and keeps turning while these run —
      and every other button still answers. That is the whole point.
    </p>

    <h2>fs.readFile</h2>
    <p>
      <input id="path" type="text" value="/etc/hosts" style="width: 24em" />
      <button id="read">read</button>
      <button id="open">pick a file…</button>
      <button id="save">save as…</button>
      <span id="fileinfo"></span>
    </p>
    <pre id="filecontent" style="max-height: 12em; overflow: auto; background: #f5f5f5; padding: 0.5em"></pre>

    <script>
      // `janela.invoke(name, args)` and `janela.listen(event, cb)` are injected by
      // janela before the page loads — the Tauri-shaped frontend API.
      window.onload = async () => {
        const out = document.getElementById("out");
        const events = document.getElementById("events");

        janela.listen("added", (sum) => {
          const li = document.createElement("li");
          li.textContent = "event 'added' from host: " + sum;
          events.prepend(li);
        });

        out.textContent = await janela.invoke("greet", { name: "demo" });
        await janela.invoke("log", "page loaded");

        document.getElementById("add").onclick = async () => {
          const a = Number(document.getElementById("a").value);
          const b = Number(document.getElementById("b").value);
          const sum = await janela.invoke("add", { a, b });
          out.textContent = `add(${a}, ${b}) -> ${sum}`;
        };
        // Native dialogs. Both are async commands, so the window keeps
        // serving other calls for as long as the panel is up.
        document.getElementById("open").onclick = async () => {
          const r = await janela.invoke("openFile", {});
          if (!r.ok) out.textContent = "error: " + r.error;
          else if (r.cancelled) out.textContent = "cancelled";
          else out.textContent = `${r.path}: ${r.length} chars\n\n` + r.text.slice(0, 400);
        };

        document.getElementById("save").onclick = async () => {
          const r = await janela.invoke("saveAs", { text: out.textContent });
          out.textContent = r.ok
            ? (r.cancelled ? "cancelled" : "wrote " + r.path)
            : "error: " + r.error;
        };

        document.getElementById("quit").onclick = () => janela.invoke("quit");

        // A page-driven spinner: proof the UI thread is never parked.
        const spinner = document.getElementById("spinner");
        const frames = ["◐", "◓", "◑", "◒"];
        let f = 0;
        setInterval(() => { spinner.textContent = frames[f++ % frames.length]; }, 120);

        const asyncout = document.getElementById("asyncout");
        document.getElementById("wait").onclick = async (e) => {
          e.target.disabled = true;
          asyncout.textContent = "waiting…";
          asyncout.textContent = await janela.invoke("wait", { ms: 2000 });
          e.target.disabled = false;
        };
        document.getElementById("count").onclick = async (e) => {
          e.target.disabled = true;
          asyncout.textContent = "counting…";
          const n = await janela.invoke("countTo", { n: 20000000 });
          asyncout.textContent = "counted to " + n;
          e.target.disabled = false;
        };

        document.getElementById("read").onclick = async () => {
          const path = document.getElementById("path").value;
          const info = document.getElementById("fileinfo");
          const content = document.getElementById("filecontent");
          const r = await janela.invoke("readFile", { path });
          if (r.ok) {
            info.textContent = r.size + " bytes" + (r.truncated ? " (preview truncated)" : "");
            content.textContent = r.content;
          } else {
            info.textContent = "";
            content.textContent = "error: " + r.error;
          }
        };
      };
    </script>
  </body>
</html>
