name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Runs the end-to-end suite (tests/e2e) on every desktop platform janela
# claims. The suite scaffolds real projects with the real CLI, builds them
# with the real toolchain, runs the produced binary, and judges the run on
# assertions the page reports — a missing assertion is a failure, so a binary
# that starts and exits 0 without doing anything cannot pass.
#
# The iOS and Android lanes need a booted simulator or emulator, so they are
# not run here; they are opt-in locally (JANELA_TEST_LANES=ios,android) and
# documented in docs/testing.md. `lane.available()` skips them rather than
# failing, so nothing here is silently broken by their absence.
jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Shared CI runners cannot honestly hold the local latency bounds (a
      # 50 ms drain p99 on a contended box measures the neighbours, not
      # janela), so the timing assertions are relaxed here. They still catch
      # the regression they exist for — a blocking read that stalls the UI
      # thread for whole seconds — while the tight local defaults stay the
      # real performance gate.
      JANELA_TEST_SYNC_MAX_MS: 750
      JANELA_TEST_DRAIN_P99_MAX_MS: 300
      # Enough to need staged reads without spending CI minutes on I/O.
      JANELA_TEST_BIG_MB: 16
      JANELA_TEST_TEMPLATES: vanilla,vue
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install webview build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb

      # scriptc's Windows runtime needs a full mingw-w64 (ssize_t, nanosleep,
      # clock_gettime), so the Windows leg uses llvm-mingw's clang rather than
      # the runner's MSVC-targeting one. Prepended to PATH so it wins.
      - name: Install llvm-mingw (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '20240619'
          $zip = "$env:RUNNER_TEMP\llvm-mingw.zip"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$tag/llvm-mingw-$tag-ucrt-x86_64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\llvm-mingw" -Force
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\llvm-mingw" -Directory | Select-Object -First 1).FullName + '\bin'
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$bin\clang" -dumpmachine

      - run: pnpm install --frozen-lockfile

      # Fast gates first: these need no toolchain and fail in seconds, so a
      # broken contract or a bad CLI argument does not wait on a full build.
      - name: Unit tests
        run: pnpm --filter janela test:unit

      - name: Typed-contract compile-fail suite
        run: pnpm --filter janela test:types

      # Verifies the published size figures against docs/sizes.json: the
      # generated table, the ranges quoted in the READMEs and on the website,
      # and whether any column predates the current version. Builds nothing,
      # so it costs seconds. Refreshing a column is a local, deliberate act
      # (`--measure`), because CI runners are not the machines the figures
      # describe.
      - name: Published sizes
        run: pnpm check:sizes

      # The desktop lane supplies its own Xvfb display when DISPLAY is unset,
      # so this needs no wrapper.
      - name: End-to-end suite
        run: pnpm test:e2e

      # The fixture projects are deleted on success; on failure they are the
      # only way to see what was actually built and run.
      - name: Keep failed fixtures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fixtures-${{ matrix.os }}
          path: |
            .janela-tests/**/index.html
            .janela-tests/**/src-host/**
            .janela-tests/**/janela.conf.json
          # `.janela-tests` is dot-prefixed, and upload-artifact treats that
          # as hidden and silently skips it.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
