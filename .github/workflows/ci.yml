name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install webview build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb
      # scriptc's Windows runtime needs a full mingw-w64 (ssize_t, nanosleep,
      # clock_gettime), so the Windows leg uses llvm-mingw's clang rather than
      # the runner's MSVC-targeting one. Prepended to PATH so it wins.
      - name: Install llvm-mingw (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '20240619'
          $zip = "$env:RUNNER_TEMP\llvm-mingw.zip"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$tag/llvm-mingw-$tag-ucrt-x86_64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\llvm-mingw" -Force
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\llvm-mingw" -Directory | Select-Object -First 1).FullName + '\bin'
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$bin\clang" -dumpmachine
      - run: npm ci
      - name: Scaffold a smoke project
        run: node bin/janela.mjs init smoke
      - name: Make the smoke page self-terminating
        shell: bash
        run: |
          cat > smoke/index.html <<'EOF'
          <!doctype html><html><body>
          <script>
          window.onload = async () => {
            await janela.invoke("log", "ci smoke page loaded");
            await janela.invoke("quit");
          };
          </script></body></html>
          EOF
      - name: Build the smoke app
        id: build
        continue-on-error: ${{ runner.os == 'Windows' }}
        working-directory: smoke
        # CCC_OVERRIDE_OPTIONS injects -v into every clang invocation, so the
        # link line and lld's real diagnostics reach scriptc's error report.
        env:
          CCC_OVERRIDE_OPTIONS: ${{ runner.os == 'Windows' && '+-v' || '' }}
        run: node ../bin/janela.mjs build
      # TEMPORARY: scriptc reports only clang's summary line when the link
      # fails, so reproduce the C++ runtime link by hand to see the real error.
      - name: Diagnose the Windows link
        if: runner.os == 'Windows' && steps.build.outcome == 'failure'
        shell: bash
        run: |
          CLANGDIR=$(dirname "$(which clang)")
          echo "--- pthread libs available ---"
          ls "$CLANGDIR/../x86_64-w64-mingw32/lib/" | grep -iE "pthread" || echo "NONE"
      - name: Fail if the Windows build failed
        if: runner.os == 'Windows' && steps.build.outcome == 'failure'
        run: exit 1
      # macOS runners have no reliable window session for WKWebView, so the
      # macOS leg is build-only; the binary is exercised on Linux under Xvfb.
      - name: Run the smoke app headless (must exit 0)
        if: runner.os == 'Linux'
        working-directory: smoke
        run: xvfb-run -a ./.janela/out/smoke
      - name: Confirm the Windows .exe was produced
        if: runner.os == 'Windows'
        working-directory: smoke
        shell: bash
        run: test -f ./.janela/out/smoke.exe && ls -l ./.janela/out/smoke.exe
      # Evidence-gathering only: whether a WebView2 window can come up on a
      # headless Windows runner is unknown, so a failure here must not fail CI.
      - name: Try running the Windows app (non-blocking)
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: smoke
        shell: bash
        run: timeout 90 ./.janela/out/smoke.exe; echo "exit=$?"
