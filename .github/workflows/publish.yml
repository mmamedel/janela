name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read

# One publish pipeline at a time; queued runs wait rather than race.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # A merge that does not bump package.json's version must succeed as a
  # no-op: this job always succeeds and the later jobs are skipped.
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      should-publish: ${{ steps.check.outputs.should-publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compare package.json version against the registry
        id: check
        run: |
          local_version="$(node -p "require('./packages/janela/package.json').version")"
          echo "version=$local_version" >> "$GITHUB_OUTPUT"
          # Exact-version existence check: also correct when local version is
          # older than the registry's `latest` (plain `npm view janela version`
          # only reports latest).
          published="$(npm view "janela@$local_version" version 2>/dev/null || true)"
          if [ "$published" = "$local_version" ]; then
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
            echo "janela@$local_version already on the registry — skipping publish."
          else
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            echo "janela@$local_version is not on the registry — will publish."
          fi

  # create-janela versions independently of janela: a release that only touches
  # the framework must not republish the scaffolder, and vice versa.
  check-create-version:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      should-publish: ${{ steps.check.outputs.should-publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compare package.json version against the registry
        id: check
        run: |
          local_version="$(node -p "require('./packages/create-janela/package.json').version")"
          echo "version=$local_version" >> "$GITHUB_OUTPUT"
          published="$(npm view "create-janela@$local_version" version 2>/dev/null || true)"
          if [ "$published" = "$local_version" ]; then
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
            echo "create-janela@$local_version already on the registry — skipping publish."
          else
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            echo "create-janela@$local_version is not on the registry — will publish."
          fi

  # Build and run a scaffolded app end to end before anything reaches npm.
  sanity:
    # Runs when EITHER package is publishing. It scaffolds through
    # create-janela and runs the binary, so it is the gate a scaffolder release
    # most needs — and publish-create requires it to have succeeded. Gating it
    # on janela's version alone meant a create-janela-only release skipped
    # sanity, which skipped publish-create, so that release could never reach
    # the registry at all.
    needs: [check-version, check-create-version]
    if: |
      needs.check-version.outputs.should-publish == 'true' ||
      needs.check-create-version.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install webview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb
      - run: pnpm install --frozen-lockfile
      # Through create-janela, not janela directly: the scaffolder is the path
      # most people take, so it is the one that has to work. --no-install
      # because this smoke project is the no-framework template.
      - name: Scaffold a smoke project through create-janela
        run: node packages/create-janela/index.mjs smoke --template vanilla --yes
      # Both sides are the smoke test's own, not the template's. A CI runner
      # has nobody to close the window, so the app has to quit itself — and
      # when the starter stopped registering `quit`, this page's invoke never
      # resolved and the job hung until it timed out. The suite in tests/e2e
      # owns its host for exactly this reason; so does this.
      - name: Give the smoke project a self-terminating page and host
        run: |
          cat > smoke/index.html <<'EOF'
          <!doctype html><html><body>
          <script>
          window.onload = async () => {
            await janela.invoke("log", "ci smoke page loaded");
            await janela.invoke("quit");
          };
          </script></body></html>
          EOF
          cat > smoke/src-host/main.ts <<'EOF'
          import type { JanelaApp } from "janela/host";

          export function setup(app: JanelaApp): void {
            app.command("log", (args) => {
              console.log("[host] page says:", args as string);
            });
            app.command("quit", (_args) => {
              app.quit();
            });
          }
          EOF
      - name: Build the smoke app
        working-directory: smoke
        run: node ../packages/janela/bin/janela.mjs build
      - name: Run the smoke app headless (must exit 0)
        working-directory: smoke
        run: xvfb-run -a ./.janela/out/smoke

  publish:
    needs: [check-version, sanity]
    if: needs.check-version.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # OIDC token for npm trusted publishing — no NPM_TOKEN secret involved.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm (trusted publishing needs npm >= 11.5)
        run: npm install -g npm@latest
      - name: Publish janela@${{ needs.check-version.outputs.version }}
        working-directory: packages/janela
        run: npm publish

  publish-create:
    # After janela's publish, and tolerant of it being skipped: a create-janela
    # bump on its own is a valid release. `always()` plus the explicit result
    # check is what allows "skipped" while still blocking on "failure".
    needs: [check-version, check-create-version, sanity, publish]
    if: |
      always() &&
      needs.check-create-version.outputs.should-publish == 'true' &&
      needs.sanity.result == 'success' &&
      needs.publish.result != 'failure' &&
      needs.publish.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm (trusted publishing needs npm >= 11.5)
        run: npm install -g npm@latest
      # The repo declares `janela: workspace:^` so a checkout installs by
      # linking the sibling and never asks the registry for a version that may
      # not exist yet — that chicken-and-egg turned CI red once already. npm
      # does not understand the workspace protocol, so the concrete range is
      # written here, immediately before publishing. `pnpm publish` would do
      # this rewrite itself, but npm is what carries the OIDC exchange for
      # trusted publishing, so the rewrite is explicit instead.
      #
      # janela's version is the right pin whether or not this run published it:
      # if the publish job was skipped, that version is already on the
      # registry.
      # `>=`, deliberately, not `^`. On a 0.x version the caret pins the MINOR:
      # `^0.15.0` means `>=0.15.0 <0.16.0`, so a create-janela published during
      # 0.15 kept scaffolding the 0.15 starter after janela 0.16 shipped, and
      # only a republish here would have fixed it. A scaffolder wants the
      # newest framework, and its surface on janela is one command line
      # (`init <name> --template <t>`) plus a defensively-imported validator.
      - name: Pin the janela dependency to >=${{ needs.check-version.outputs.version }}
        working-directory: packages/create-janela
        run: |
          npm pkg set dependencies.janela=">=${{ needs.check-version.outputs.version }}"
          node -e "
            const dep = require('./package.json').dependencies.janela;
            if (dep.startsWith('workspace:')) { console.error('workspace spec survived the rewrite: ' + dep); process.exit(1); }
            console.log('publishing with janela ' + dep);
          "
      - name: Publish create-janela@${{ needs.check-create-version.outputs.version }}
        working-directory: packages/create-janela
        run: npm publish

  # Tag and release the published commit. Gated twice over: `needs: publish`
  # carries an implicit success() (a skipped or failed publish skips this job),
  # and the `if` re-checks both the version decision and the publish result. So
  # a merge that does not bump the version stays a clean no-op with no tag.
  tag:
    needs: [check-version, publish]
    if: needs.check-version.outputs.should-publish == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      # The only job that writes to the repo; the rest stay read-only.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit that was smoke-tested and published — never a
          # moving ref.
          ref: ${{ github.sha }}
      - name: Tag v${{ needs.check-version.outputs.version }} and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"

          # Never move an existing tag. npm already has this version by now, so
          # a collision means the repo state needs a human — say so and stop.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists on origin — refusing to move it. janela@$VERSION IS published; reconcile the tag by hand."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "janela $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

          # --verify-tag: release the annotated tag just pushed, never let gh
          # invent its own. Retry briefly for tag visibility on the API side.
          for attempt in 1 2 3; do
            if gh release create "$tag" --title "$tag" --generate-notes --verify-tag; then
              exit 0
            fi
            echo "release attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          echo "::error::$tag was pushed but the GitHub release could not be created. Run: gh release create $tag --generate-notes --verify-tag"
          exit 1
