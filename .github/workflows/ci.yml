name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install webview build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb
      # scriptc's Windows runtime is MinGW-shaped, so the Windows leg builds
      # through zig's bundled mingw-w64 toolchain rather than MSVC.
      - name: Install zig (Windows)
        if: runner.os == 'Windows'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - run: npm ci
      - name: Scaffold a smoke project
        run: node bin/janela.mjs init smoke
      - name: Make the smoke page self-terminating
        shell: bash
        run: |
          cat > smoke/index.html <<'EOF'
          <!doctype html><html><body>
          <script>
          window.onload = async () => {
            await janela.invoke("log", "ci smoke page loaded");
            await janela.invoke("quit");
          };
          </script></body></html>
          EOF
      - name: Build the smoke app
        working-directory: smoke
        run: node ../bin/janela.mjs build
      # macOS runners have no reliable window session for WKWebView, so the
      # macOS leg is build-only; the binary is exercised on Linux under Xvfb.
      - name: Run the smoke app headless (must exit 0)
        if: runner.os == 'Linux'
        working-directory: smoke
        run: xvfb-run -a ./.janela/out/smoke
      - name: Confirm the Windows .exe was produced
        if: runner.os == 'Windows'
        working-directory: smoke
        shell: bash
        run: test -f ./.janela/out/smoke.exe && ls -l ./.janela/out/smoke.exe
      # Evidence-gathering only: whether a WebView2 window can come up on a
      # headless Windows runner is unknown, so a failure here must not fail CI.
      - name: Try running the Windows app (non-blocking)
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: smoke
        shell: bash
        run: timeout 90 ./.janela/out/smoke.exe; echo "exit=$?"
